name: Deploy Databricks demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble public site
        run: |
          mkdir -p _site/videos/voiceover
          cp index.html _site/index.html
          cp -R site _site/site
          cp -R videos/recordings _site/videos/recordings
          cp videos/voiceover/zh-CN-narration.json _site/videos/voiceover/
          cp videos/voiceover/build-report.json _site/videos/voiceover/
          cp videos/voiceover/SHA256SUMS _site/videos/voiceover/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
